<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#F0F6FC"/>
<title>Puzzle #71 Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
body {
    background-color: #E9F2FA; /* Fundo azul gelo muito claro */
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 12px;
    color: #1E293B;
}
.app-container {
    max-width: 420px;
    width: 100%;
}

/* Header Compacto - Azul */
.app-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
}
.icon {
    background: linear-gradient(135deg, #007AFF, #00B4DB); /* Azul Céu */
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    flex-shrink: 0;
    box-shadow: 0 4px 10px rgba(0, 122, 255, 0.25);
}
.header-text h1 { font-size: 18px; font-weight: 700; line-height: 1.2; color: #0F172A; }
.header-text span { font-size: 12px; color: #64748B; display: block; }

/* Cartões - Com bordas azuis sutis */
.card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 122, 255, 0.06);
    border: 1px solid rgba(0, 122, 255, 0.08); /* Borda azul suave */
}

/* Inputs e Selects - Foco Azul */
.input-group { margin-bottom: 6px; }
.input-group label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 3px; }
.input-group select, .input-group input {
    width: 100%;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid #E2E8F0;
    background: #F8FAFC;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
}
.input-group input:focus { border-color: #007AFF; background: #fff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1); }

/* Botão de Arquivo - Azul */
.file-wrapper { position: relative; display: inline-block; width: 100%; }
.file-wrapper input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.file-label {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; background: #F0F7FF; border-radius: 8px; color: #007AFF;
    font-size: 13px; font-weight: 500; border: 1px dashed #A0CFFF; width: 100%;
}

/* Grid de Configuração */
.config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* Botões de Ação - Estilo Moderno */
.actions { display: flex; gap: 10px; margin-bottom: 12px; }
.btn {
    flex: 1; padding: 10px 0; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; text-align: center;
    transition: all 0.2s;
}
.btn-primary {
    background: linear-gradient(135deg, #007AFF, #0055CC);
    color: #fff;
    box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
}
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { background: #CBD5E1; box-shadow: none; color: #94A3B8; }

.btn-secondary {
    background: transparent;
    color: #007AFF;
    border: 2px solid #007AFF;
}
.btn-secondary:active { background: rgba(0, 122, 255, 0.05); }
.btn-secondary:disabled { border-color: #CBD5E1; color: #94A3B8; }

.btn-danger {
    background: #FEF2F2;
    color: #EF4444;
    border: 1px solid #FECACA;
    font-size: 13px; padding: 8px 0;
}
.btn-danger:active { background: #FEE2E2; }

/* Painel de Status */
.status-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.status-left { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.dot.idle { background: #94A3B8; }
.dot.running { background: #007AFF; animation: pulse 1.2s infinite; }
@keyframes pulse { 0%{opacity:1; box-shadow: 0 0 0 0 rgba(0,122,255,0.7)} 50%{opacity:0.6; box-shadow: 0 0 0 6px rgba(0,122,255,0)} 100%{opacity:1; box-shadow: 0 0 0 0 rgba(0,122,255,0)} }
.status-label { color: #94A3B8; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

/* Barra de Progresso - Azul */
.progress-container { width: 100%; height: 3px; background: #E2E8F0; border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
.progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #007AFF, #00B4DB); transition: width 0.3s ease; }

/* Key Box - Azul muito claro */
.key-box {
    background: #F4F9FF; border: 1px solid #E0F0FF; border-radius: 8px;
    padding: 8px 10px; font-size: 12px; font-family: monospace;
    color: #007AFF; word-break: break-all; margin-bottom: 10px;
    min-height: 30px; display: flex; align-items: center;
}

/* Grid de Métricas (4 itens) */
.metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 4px;
    padding-top: 8px;
    border-top: 1px solid #E2E8F0;
}
.metric-item { display: flex; flex-direction: column; align-items: center; text-align: center; }
.metric-value { font-size: 16px; font-weight: 700; color: #0F172A; }
.metric-value.primary { color: #007AFF; }
.metric-label { font-size: 10px; color: #64748B; font-weight: 500; margin-top: 2px; display: flex; align-items: center; gap: 3px; }

/* Hit Box - Azul */
.hit-box { background: #F0F7FF; border: 2px solid #007AFF; border-radius: 12px; padding: 10px; margin-top: 8px; display: none; }
.hit-box h4 { color: #007AFF; font-size: 14px; margin-bottom: 4px; }
.hit-box pre { background: #fff; padding: 8px; border-radius: 6px; font-size: 11px; white-space: pre-wrap; word-break: break-all; border: 1px solid #D0E6FF; color: #1E293B; }

/* Responsividade */
@media (max-width: 380px) {
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-item { align-items: flex-start; text-align: left; }
}
</style>
</head>
<body>
<div class="app-container">

    <!-- Header -->
    <div class="app-header">
        <div class="icon">₿</div>
        <div class="header-text">
            <h1>Puzzle #71</h1>
            <span>Scanner secp256k1</span>
        </div>
    </div>

    <!-- Configurações -->
    <div class="card">
        <div class="config-grid">
            <div class="input-group">
                <label>Alvo</label>
                <div class="file-wrapper">
                    <input type="file" id="fileIn" accept=".txt"/>
                    <div class="file-label" id="fileStatus">📂 Carregar</div>
                </div>
            </div>
            <div class="input-group">
                <label>Range</label>
                <input type="text" id="rangeIn" value="71" style="text-align:center;"/>
            </div>
        </div>
        <div class="config-grid" style="margin-top:6px;">
            <div class="input-group">
                <label>Workers</label>
                <input type="number" id="wkIn" value="4" min="1" max="32" style="text-align:center;"/>
            </div>
            <div class="input-group" style="display:flex; align-items:flex-end; justify-content:flex-end;"></div>
        </div>
    </div>

    <!-- Ações -->
    <div class="actions">
        <button class="btn btn-primary" id="btnStart" onclick="App.start()">▶ Iniciar</button>
        <button class="btn btn-secondary" id="btnStop" onclick="App.stop()" disabled>⏹ Parar</button>
    </div>
    <button class="btn btn-danger" id="btnReset" onclick="App.reset()" style="width:100%; margin-bottom:12px;">⟳ Reiniciar</button>

    <!-- Status -->
    <div class="card">
        <div class="status-header">
            <div class="status-left">
                <span class="dot idle" id="statusDot"></span>
                <span id="statusText">Parado</span>
            </div>
            <span class="status-label">LIVE</span>
        </div>
        <div class="progress-container">
            <div class="progress-fill" id="pFill"></div>
        </div>
        <div class="key-box" id="keyDisplay">—</div>

        <div class="metrics-grid">
            <div class="metric-item">
                <span class="metric-value" id="timeD">00:00</span>
                <span class="metric-label">⏱ Tempo</span>
            </div>
            <div class="metric-item">
                <span class="metric-value primary" id="speedD">0</span>
                <span class="metric-label">⚡ /s</span>
            </div>
            <div class="metric-item">
                <span class="metric-value" id="checkedD">0</span>
                <span class="metric-label">🔑 Testes</span>
            </div>
            <div class="metric-item">
                <span class="metric-value" id="alvoD">0</span>
                <span class="metric-label">🎯 Alvos</span>
            </div>
        </div>

        <div class="hit-box" id="hitBox">
            <h4>🏆 CHAVE ENCONTRADA!</h4>
            <pre id="hitContent"></pre>
        </div>
    </div>

    <div style="text-align:center; color:#94A3B8; font-size:11px; margin-top:8px;">
        O Senhor é o meu Pastor
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════

function ripemd160(d){function f(j,x,y,z){if(j<16)return(x^y^z)>>>0;if(j<32)return((x&y)|(~x&z))>>>0;if(j<48)return((x|~y)^z)>>>0;if(j<64)return((x&z)|(y&~z))>>>0;return(x^(y|~z))>>>0;}function rol(x,n){return((x<<n)|(x>>>(32-n)))>>>0;}const l=d.length,k=((55-l)%64+64)%64;const m=new Uint8Array(l+k+9);m.set(d);m[l]=0x80;const b=l*8;m[m.length-8]=b&0xff;m[m.length-7]=(b>>>8)&0xff;m[m.length-6]=(b>>>16)&0xff;m[m.length-5]=(b>>>24)&0xff;let[h0,h1,h2,h3,h4]=[0x67452301,0xefcdab89,0x98badcfe,0x10325476,0xc3d2e1f0];for(let i=0;i<m.length;i+=64){const X=new Int32Array(16);for(let j=0;j<16;j++)X[j]=m[i+j*4]|(m[i+j*4+1]<<8)|(m[i+j*4+2]<<16)|(m[i+j*4+3]<<24);let[al,bl,cl,dl,el]=[h0,h1,h2,h3,h4];let[ar,br,cr,dr,er]=[h0,h1,h2,h3,h4];for(let j=0;j<80;j++){const rn=j>>4;let T=(al+f(j,bl,cl,dl)+X[RIPE_RL[j]]+(RIPE_KL[rn]|0))>>>0;T=rol(T,RIPE_SL[j]);T=(T+el)>>>0;al=el;el=dl;dl=rol(cl,10);cl=bl;bl=T;T=(ar+f(79-j,br,cr,dr)+X[RIPE_RR[j]]+(RIPE_KR[rn]|0))>>>0;T=rol(T,RIPE_SR[j]);T=(T+er)>>>0;ar=er;er=dr;dr=rol(cr,10);cr=br;br=T;}const T2=(h1+cl+dr)>>>0;h1=(h2+dl+er)>>>0;h2=(h3+el+ar)>>>0;h3=(h4+al+br)>>>0;h4=(h0+bl+cr)>>>0;h0=T2;}const r=new Uint8Array(20);const pk=(v,o)=>{r[o]=v&0xff;r[o+1]=(v>>>8)&0xff;r[o+2]=(v>>>16)&0xff;r[o+3]=(v>>>24)&0xff;};pk(h0,0);pk(h1,4);pk(h2,8);pk(h3,12);pk(h4,16);return r;}

function hash160(d){return ripemd160(sha256(d));}

const P_=BigInt('0xFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFEFFFFFC2F');

function addrP2SH(h){return withCk(5,h);}
function wifC(kb){const p=new Uint8Array(33);p.set(kb);p[32]=1;return withCk(0x80,p);}
function addrBech32(h160){const B32C='qpzry9x8gf2tvdw0s3jn54khce6mua7l';function poly(v){const G=[0x3b6a57b2,0x26508e6d,0x1ea119fa,0x3d4233dd,0x2a1462b3];let c=1;for(const d of v){const b=c>>>25;c=((c&0x1ffffff)<<5)^d;for(let i=0;i<5;i++)if((b>>>i)&1)c^=G[i];}return c;}function hrpE(h){return [...h].map(c=>c.charCodeAt(0)>>5).concat([0],...[...h].map(c=>c.charCodeAt(0)&31));}function cb58(d,f,t){let acc=0,bits=0;const r=[];const max=(1<<t)-1;for(const v of d){acc=(acc<<f)|v;bits+=f;while(bits>=t){bits-=t;r.push((acc>>bits)&max);}}return r;}const d5=[0,...cb58([...h160],8,5)];const vals=[...hrpE('bc'),...d5,0,0,0,0,0,0];const pm=poly(vals)^1;const chk=[(pm>>25)&31,(pm>>20)&31,(pm>>15)&31,(pm>>10)&31,(pm>>5)&31,pm&31];return'bc1'+[...d5,...chk].map(v=>B32C[v]).join('');}
function allAddrs(x,y){const kh=hash160(pubC(x,y));const rs=new Uint8Array(22);rs[0]=0;rs[1]=20;rs.set(kh,2);return{p2pkh:addrP2PKH(kh),bech32:addrBech32(kh),p2sh:addrP2SH(hash160(rs)),uh:hash160(pubU(x,y))};}
`;

// ═══════════════════════════════════════════════════════════════════
// WORKER CODE
// ═══════════════════════════════════════════════════════════════════
const WORKER_CODE = CRYPTO_CODE + `
function lookup(h20, buf, n){
  const pre=(h20[0]<<8)|h20[1];
  let lo=0,hi=n;
  while(lo<hi){const mid=(lo+hi)>>1;const p=mid*20;let cmp=0;
    for(let i=0;i<20;i++){const d=h20[i]-buf[p+i];if(d!==0){cmp=d;break;}}
    if(cmp===0)return true;if(cmp>0)lo=mid+1;else hi=mid;}
  return false;
}
function batchInv(vals,P){
  const n=vals.length;const pre=new Array(n+1);pre[0]=1n;
  for(let i=0;i<n;i++)pre[i+1]=pre[i]*vals[i]%P;
  let inv=modinv(pre[n]);const out=new Array(n);
  for(let i=n-1;i>=0;i--){out[i]=inv*pre[i]%P;inv=inv*vals[i]%P;}
  return out;
}
self.onmessage=function(e){
  const{wid,startHex,endHex,targets,needSH,needUnc,batchSize}=e.data;
  const buf=targets?new Uint8Array(targets):null;
  const n=buf?buf.length/20:0;
  let k=BigInt('0x'+startHex);
  const kEnd=BigInt('0x'+endHex);
  let[qx,qy]=scalarmul(k);
  let tested=0n;
  const BATCH=batchSize||512;
  const GPx=new Array(BATCH),GPy=new Array(BATCH);
  {let[cx,cy]=[Gx_,Gy_];GPx[0]=Gx_;GPy[0]=Gy_;for(let i=1;i<BATCH;i++){[cx,cy]=ptadd(cx,cy,Gx_,Gy_);GPx[i]=cx;GPy[i]=cy;}}
  function hit(kk,match,x,y){
    const kb=b32(kk);
    const ad=allAddrs(x,y);
    self.postMessage({type:'hit',wid,key:'0x'+kk.toString(16),match,wif:wifC(kb),
      p2pkh:ad.p2pkh,bech32:ad.bech32,p2sh:ad.p2sh});
  }
  function check(kk,x,y){
    const h=hash160(pubC(x,y));
    if(buf){
      if(lookup(h,buf,n)){hit(kk,'p2pkh/bech32',x,y);return true;}
      if(needSH){const rs=new Uint8Array(22);rs[0]=0;rs[1]=20;rs.set(h,2);const sh=hash160(rs);if(lookup(sh,buf,n)){hit(kk,'p2sh',x,y);return true;}}
      if(needUnc){const uh=allAddrs(x,y).uh;if(lookup(uh,buf,n)){hit(kk,'p2pkh-uncompressed',x,y);return true;}}
    } else {
      const TARGET=new Uint8Array([0xf6,0xf5,0x43,0x1d,0x25,0xbb,0xf7,0xb1,0x2e,0x8a,0xdd,0x9a,0xf5,0xe3,0x47,0x5c,0x44,0xa0,0xa5,0xb8]);
      if(h.every((v,i)=>v===TARGET[i])){hit(kk,'p2pkh/bech32 (#71)',x,y);return true;}
    }
    return false;
  }
  if(check(k,qx,qy))return;
  let lastReport=Date.now();
  while(k<kEnd){
    const rem=kEnd-k;const B=rem<BigInt(BATCH)?Number(rem):BATCH;
    const ds=new Array(B);
    for(let j=0;j<B;j++)ds[j]=(GPx[j]-qx+P_*2n)%P_;
    const inv=batchInv(ds,P_);
    let lx=qx,ly=qy;
    for(let j=0;j<B;j++){
      let nx,ny;
      if(inv[j]===0n){
        [nx,ny]=scalarmul(k+BigInt(j+1));lx=nx;ly=ny;
      } else {
        const lam=(GPy[j]-qy+P_*2n)%P_*inv[j]%P_;
        nx=modp(lam*lam-qx-GPx[j]);ny=modp(lam*(qx-nx)-qy);lx=nx;ly=ny;
      }
      if(check(k+BigInt(j+1),nx,ny))return;
    }
    qx=lx;qy=ly;k+=BigInt(B);tested+=BigInt(B);
    const now=Date.now();
    if(now-lastReport>=1500){
      self.postMessage({type:'progress',wid,delta:tested.toString(),pos:'0x'+k.toString(16)});
      tested=0n;lastReport=now;
    }
  }
  self.postMessage({type:'done',wid,delta:tested.toString()});
};
`;

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════
const App = {
  workers: [], running: false,
  tested: 0n, startTime: 0, elapsed: 0,
  speedHistory: [], speedLast: 0, testedLast: 0n, timeLast: 0,
  targetBuf: null, targetCount: 0, rangeLo: 0n, rangeHi: 0n, ks: 0n,

  init() {
    const cores = navigator.hardwareConcurrency || 4;
    document.getElementById('wkIn').value = Math.max(1, Math.min(cores - 1, 8));
    this.parseRange('71');
    document.getElementById('rangeIn').addEventListener('input', e => this.parseRange(e.target.value));
    document.getElementById('fileIn').addEventListener('change', e => this.loadFile(e));
    this.updateUI();
  },

  parseRange(raw) {
    raw = raw.trim();
    let lo, hi;
    if (raw.includes('-')) {
      const [a, b] = raw.split('-').map(s => parseInt(s));
      if (isNaN(a) || isNaN(b) || a < 1 || b > 256 || a > b) return;
      lo = 1n << BigInt(a - 1); hi = (1n << BigInt(b)) - 1n;
    } else {
      const n = parseInt(raw);
      if (isNaN(n) || n < 1 || n > 256) return;
      lo = 1n << BigInt(n - 1); hi = (1n << BigInt(n)) - 1n;
    }
    this.rangeLo = lo; this.rangeHi = hi; this.ks = hi - lo + 1n;
  },

  loadFile(e) {
    const file = e.target.files[0]; if (!file) return;
    document.getElementById('fileStatus').textContent = '🔄';
    const reader = new FileReader();
    reader.onload = ev => {
      const lines = ev.target.result.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
      const h160s = [];
      for (const addr of lines) {
        const h = this.addrToH160Main(addr);
        if (h) h160s.push(h);
      }
      h160s.sort((a, b) => { for (let i = 0; i < 20; i++) { if (a[i] !== b[i]) return a[i] - b[i]; } return 0; });
      const buf = new Uint8Array(h160s.length * 20);
      h160s.forEach((h, i) => buf.set(h, i * 20));
      this.targetBuf = buf;
      this.targetCount = h160s.length;
      document.getElementById('fileStatus').textContent = `📂 ${h160s.length}`;
      document.getElementById('alvoD').textContent = h160s.length;
      document.getElementById('btnStart').disabled = false;
    };
    reader.readAsText(file);
  },

  addrToH160Main(addr) {
    addr = addr.trim();
    if (!addr) return null;
    if (addr.toLowerCase().startsWith('bc1')) {
      const C = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      const a = addr.toLowerCase(); const pos = a.lastIndexOf('1');
      if (pos < 1) return null;
      const data = []; for (const c of a.slice(pos + 1)) { const v = C.indexOf(c); if (v < 0) return null; data.push(v); }
      const inner = data.slice(0, -6); if (inner[0] !== 0) return null;
      const prog = []; let acc = 0, bits = 0;
      for (const v of inner.slice(1)) { acc = (acc << 5) | v; bits += 5; while (bits >= 8) { bits -= 8; prog.push((acc >> bits) & 0xff); } }
      if (prog.length !== 20) return null;
      return new Uint8Array(prog);
    }
    const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
    const bmap = new Uint8Array(256).fill(255); for (let i = 0; i < 58; i++) bmap[B58.charCodeAt(i)] = i;
    let n = 0n; for (const c of addr) { const v = bmap[c.charCodeAt(0)]; if (v === 255) return null; n = n * 58n + BigInt(v); }
    let h = n.toString(16); if (h.length % 2) h = '0' + h;
    const raw = new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
    let lead = 0; for (const c of addr) { if (c !== '1') break; lead++; }
    const full = new Uint8Array(lead + raw.length); full.set(raw, lead);
    if (full.length !== 25) return null;
    if (full[0] !== 0 && full[0] !== 5) return null;
    return full.slice(1, 21);
  },

  start() {
    if (this.running) return;
    this.running = true;
    this.tested = 0n; this.startTime = Date.now();
    this.elapsed = 0; this.speedHistory = [];
    this.testedLast = 0n; this.timeLast = Date.now();
    document.getElementById('btnStart').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('statusDot').className = 'dot running';
    document.getElementById('statusText').textContent = 'Buscando';
    document.getElementById('keyDisplay').textContent = 'Iniciando...';
    document.getElementById('hitBox').style.display = 'none';

    const nw = Math.max(1, parseInt(document.getElementById('wkIn').value) || 4);
    const lo = this.rangeLo, hi = this.rangeHi;
    const span = (hi - lo + 1n) / BigInt(nw);
    const blob = new Blob([WORKER_CODE], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);

    for (let i = 0; i < nw; i++) {
      const bs = lo + BigInt(i) * span;
      const be = i === nw - 1 ? hi : (bs + span - 1n);
      const w = new Worker(url);
      const targets = this.targetBuf ? this.targetBuf.buffer : null;
      const msg = { wid: i, startHex: bs.toString(16), endHex: be.toString(16), targets, needSH: false, needUnc: false, batchSize: 256 };
      if (targets) w.postMessage(msg, [targets.slice(0)]);
      else w.postMessage(msg);
      w.onmessage = ev => this.onWorkerMsg(ev.data);
      this.workers.push(w);
    }
    this.ticker = setInterval(() => this.tick(), 800);
  },

  onWorkerMsg(d) {
    if (d.type === 'progress') {
      this.tested += BigInt(d.delta);
      document.getElementById('keyDisplay').textContent = d.pos;
    } else if (d.type === 'hit') {
      this.showHit(d);
      this.stop();
    }
  },

  showHit(d) {
    document.getElementById('hitContent').textContent = 
`CHAVE : ${d.key}
WIF   : ${d.wif}
P2PKH : ${d.p2pkh}
BECH32: ${d.bech32}
P2SH  : ${d.p2sh}`;
    document.getElementById('hitBox').style.display = 'block';
  },

  tick() {
    const now = Date.now();
    const dt = (now - this.timeLast) / 1000;
    const dT = this.tested - this.testedLast;
    const spd = dt > 0 ? Number(dT) / dt : 0;
    this.speedHistory.push(spd); if (this.speedHistory.length > 32) this.speedHistory.shift();
    this.speedLast = spd; this.testedLast = this.tested; this.timeLast = now;
    this.elapsed = (now - this.startTime) / 1000;
    this.updateUI();
  },

  updateUI() {
    const t = Number(this.tested);
    const el = this.elapsed;
    const m = String(Math.floor(el / 60)).padStart(2, '0');
    const s = String(Math.floor(el % 60)).padStart(2, '0');
    document.getElementById('timeD').textContent = `${m}:${s}`;
    document.getElementById('speedD').textContent = this.speedLast > 1000 ? (this.speedLast/1000).toFixed(1)+'k' : Math.floor(this.speedLast);
    document.getElementById('checkedD').textContent = t.toLocaleString();
  },

  stop() {
    this.running = false; clearInterval(this.ticker);
    this.workers.forEach(w => w.terminate()); this.workers = [];
    document.getElementById('btnStart').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('statusDot').className = 'dot idle';
    document.getElementById('statusText').textContent = 'Parado';
  },

  reset() {
    this.stop(); this.tested = 0n; this.elapsed = 0; this.speedHistory = [];
    this.speedLast = 0;
    document.getElementById('hitBox').style.display = 'none';
    document.getElementById('keyDisplay').textContent = '—';
    this.updateUI();
    document.getElementById('timeD').textContent = '00:00';
    document.getElementById('speedD').textContent = '0';
    document.getElementById('checkedD').textContent = '0';
  }
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
